<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glass LAN Chat</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-blur blur1"></div>
  <div class="bg-blur blur2"></div>
  <div class="grid"></div>

  <!-- JOIN SCREEN -->

  <section class="join-screen" id="join-screen">

    <div class="join-card">

      <!-- EMPLOYEE LOGO -->

<div class="logo-circle">

  <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="employee logo">

</div>

      <h1>Let’s talk</h1>

      <p class="subtitle">
        Secure Realtime Glassmorphic Chat
      </p>

      <input
        type="text"
        id="username-input"
        placeholder="Enter username"
      />

      <button id="join-btn">
        Join Chat
      </button>

    </div>

  </section>

  <!-- CHAT CONTAINER -->

  <section class="chat-container hidden" id="chat-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="sidebar-top">

        <div>
          <h2>Realtime Users</h2>
          <span id="online-count">0 Users Online</span>
        </div>

        <button class="theme-btn">
          ✨
        </button>

      </div>

      <div class="search-box">
        <input type="text" placeholder="Search user...">
      </div>

      <div class="user-list" id="user-list"></div>

      <div id="typing-indicator"></div>

    </aside>

    <!-- CHAT AREA -->

    <main class="chat-area">

      <!-- TOPBAR -->

      <div class="chat-topbar">

        <div class="topbar-left">
          <div class="avatar">V</div>

          <div>
            <h3>LAN Room</h3>
            <span>Realtime Messaging</span>
          </div>
        </div>

        
        </div>

      </div>

      <!-- MESSAGE AREA -->

      <div class="messages-container" id="messages-container">

      </div>

      <!-- EMOJI -->

      <div class="emoji-picker hidden" id="emoji-picker">

        <button class="emoji-item">😀</button>
        <button class="emoji-item">😂</button>
        <button class="emoji-item">🔥</button>
        <button class="emoji-item">❤️</button>
        <button class="emoji-item">👍</button>
        <button class="emoji-item">🎉</button>

      </div>

      <!-- COMPOSER -->

      <div class="composer">

        <button id="emoji-toggle">
          😊
        </button>

        <input
          type="text"
          id="message-input"
          placeholder="Type your message..."
        />

        <button id="send-btn">
          Send
        </button>

      </div>

    </main>

  </section>

  <audio id="notify-sound" src="notify.mp3"></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>

</body>
</html>
